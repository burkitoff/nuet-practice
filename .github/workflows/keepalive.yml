name: Keep Supabase awake
on:
  schedule: [{ cron: "17 5 */3 * *" }]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping
        run: |
          URL=$(grep -oP 'SUPABASE_URL:\s*"\K[^"]+' site/js/config.js)
          KEY=$(grep -oP 'SUPABASE_ANON_KEY:\s*"\K[^"]+' site/js/config.js)
          if [ -z "$URL" ]; then echo "config.js not filled in yet"; exit 0; fi
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
